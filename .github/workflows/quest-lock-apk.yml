name: Quest Lock APK

on:
  push:
    paths:
      - "quest-lock/android/**"
      - ".github/workflows/quest-lock-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quest-lock/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quest-lock-apk
          path: quest-lock/android/app/build/outputs/apk/debug/app-debug.apk
